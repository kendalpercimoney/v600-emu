<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V600 Emulator</title>
<style>
  :root { --bg: #ecebe7; --body: #2b2d31; --bezel: #111; --key: #3b3e44; --key-text: #f2f2f2;
          --accent: #4a8f5c; --danger: #a8423c; --muted: #6b6b6b; --text: #1d1d1f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #18191b; --body: #3a3c41; --bezel: #050505;
          --key: #4b4e55; --muted: #9a9a9a; --text: #e8e8e8; } }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 -apple-system, system-ui, sans-serif; display: flex; justify-content: center; }
  main { padding: 16px; display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .phone { background: var(--body); border-radius: 28px; padding: 22px 18px 26px; width: 376px;
           max-width: calc(100vw - 32px); box-sizing: border-box; box-shadow: 0 8px 30px #0004; }
  .screen { background: var(--bezel); border-radius: 8px; padding: 6px; }
  .screen img { display: block; width: 100%; image-rendering: pixelated; border-radius: 3px; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  button { background: var(--key); color: var(--key-text); border: 0; border-radius: 10px;
           padding: 12px 0; font: 600 15px system-ui; cursor: pointer; touch-action: none; }
  button:active, button.down { filter: brightness(1.4); }
  button.green { background: var(--accent); }
  button.red { background: var(--danger); }
  button.small { font-size: 12px; padding: 9px 0; }
  aside { max-width: 340px; color: var(--muted); }
  aside h1 { font-size: 18px; color: var(--text); margin: 4px 0 8px; }
  #log { font: 12px ui-monospace, monospace; white-space: pre-wrap; margin-top: 12px; }
  kbd { border: 1px solid var(--muted); border-radius: 4px; padding: 0 4px; font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="phone">
    <div class="screen"><img id="lcd" alt="V600 display" width="352" height="440"></div>
    <div class="keys">
      <button data-k="soft_left">Soft L</button><button data-k="menu">Menu</button><button data-k="soft_right">Soft R</button>
      <span></span><button data-k="up">▲</button><span></span>
      <button data-k="left">◀</button><button data-k="ok">OK</button><button data-k="right">▶</button>
      <span></span><button data-k="down">▼</button><span></span>
      <button data-k="green" class="green">Send</button><button data-k="smart">Smart</button><button data-k="red" class="red">End</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="*">*</button><button data-k="0">0</button><button data-k="#">#</button>
      <button data-k="vol_up" class="small">Vol +</button><button data-k="voice" class="small">Voice</button><button data-k="vol_down" class="small">Vol −</button>
    </div>
  </div>
  <aside>
    <h1>Motorola V600</h1>
    <div>Firmware TRIPLETS_G_0B.09.38R, emulated. Keyboard: digits, <kbd>*</kbd> <kbd>#</kbd>,
      arrows, <kbd>Space</kbd> OK, <kbd>Enter</kbd> send, <kbd>Esc</kbd> end (hold about 2 s to
      switch off), <kbd>F1</kbd>/<kbd>F2</kbd> soft keys, <kbd>M</kbd> menu,
      <kbd>+</kbd>/<kbd>−</kbd> volume.</div>
    <p><button id="sound" class="small" style="padding:8px 14px">Sound: off</button></p>
    <div id="status"></div>
    <div id="log"></div>
  </aside>
</main>
<script>
const lcd = document.getElementById('lcd');
let loading = false;
function refresh() {
  if (loading) return;
  loading = true;
  const img = new Image();
  img.onload = () => { lcd.src = img.src; loading = false; };
  img.onerror = () => { loading = false; };
  img.src = '/frame.png?t=' + Date.now();
}
setInterval(refresh, 120);
function send(k, down) { fetch(`/key?name=${encodeURIComponent(k)}&down=${down ? 1 : 0}`); }
for (const b of document.querySelectorAll('button[data-k]')) {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { b.setPointerCapture(e.pointerId); b.classList.add('down'); send(k, true); });
  const up = () => { if (b.classList.contains('down')) { b.classList.remove('down'); send(k, false); } };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
}
const map = { Enter: 'green', F1: 'soft_left', F2: 'soft_right', m: 'menu', M: 'menu',
              ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', ' ': 'ok',
              Escape: 'red', Backspace: 'red', '+': 'vol_up', '=': 'vol_up', '-': 'vol_down',
              '*': '*', '#': '#' };
for (let d = 0; d <= 9; d++) map[String(d)] = String(d);
const held = new Set();
addEventListener('keydown', e => { const k = map[e.key]; if (!k || held.has(k)) return;
  held.add(k); e.preventDefault(); send(k, true); });
addEventListener('keyup', e => { const k = map[e.key]; if (!k) return; held.delete(k); send(k, false); });
// Sound. /audio: first sample index (uint32 LE), then 16 kHz 16-bit PCM (v600/midi.py RATE),
// queued back to back. /media: MP3 clips (ringtones) with the sample they start / stop at,
// decoded here and placed on the same timeline. Browsers need a click before playing sound.
const RATE = 16000;
let actx = null, playAt = 0, mapSample = 0, mapTime = 0, mediaBusy = false;
const clips = new Map();
const soundBtn = document.getElementById('sound');
soundBtn.onclick = () => {
  if (actx) { actx.close(); actx = null; clips.clear(); } else { actx = new AudioContext(); playAt = 0; }
  soundBtn.textContent = actx ? 'Sound: on' : 'Sound: off';
};
const timeOf = sample => mapTime + (sample - mapSample) / RATE;
setInterval(async () => {
  if (!actx) return;
  const body = await (await fetch('/audio')).arrayBuffer();
  if (!actx || body.byteLength < 4) return;
  const start = new DataView(body).getUint32(0, true), pcm = new Int16Array(body, 4);
  if (playAt > actx.currentTime + 0.5) playAt = actx.currentTime + 0.1;   // backlog: skip ahead
  playAt = Math.max(playAt, actx.currentTime + 0.1);
  mapSample = start; mapTime = playAt;
  if (pcm.some(v => v !== 0)) {
    const buf = actx.createBuffer(1, pcm.length, RATE), ch = buf.getChannelData(0);
    for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
    const src = actx.createBufferSource();
    src.buffer = buf; src.connect(actx.destination); src.start(playAt);
  }
  playAt += pcm.length / RATE;
}, 100);
setInterval(async () => {
  if (!actx || mediaBusy) return;
  mediaBusy = true;
  try { await media(); } finally { mediaBusy = false; }
}, 250);
async function media() {
  for (const e of await (await fetch('/media')).json()) {
    if (!actx) return;
    if (e.data) {
      const bytes = Uint8Array.from(atob(e.data), c => c.charCodeAt(0));
      const src = actx.createBufferSource();
      try { src.buffer = await actx.decodeAudioData(bytes.buffer); } catch (err) { continue; }
      src.connect(actx.destination);
      const late = actx.currentTime - timeOf(e.at);
      src.start(late > 0 ? 0 : timeOf(e.at), Math.max(late, 0));
      clips.set(e.id, src);
    } else if (clips.has(e.id)) {
      clips.get(e.id).stop(Math.max(timeOf(e.at), actx.currentTime));
      clips.delete(e.id);
    }
  }
}
setInterval(async () => {
  try {
    const s = await (await fetch('/status')).json();
    document.getElementById('status').textContent =
      `Phone time ${s.seconds}s` + (s.lag > 0.5 ? ` (running ${s.lag}s behind real time)` : '');
    document.getElementById('log').textContent = s.log.join('\n');
  } catch (e) {}
}, 1000);
</script>
</body>
</html>
